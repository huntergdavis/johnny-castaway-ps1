name: Site

# P1 wiring — minimum viable Pages deploy.
# Triggers covered today: push to main (any change in site/ or workflow),
# manual dispatch. P3 will add: tags ['v*-ps1'], release: published, and a
# nightly schedule for self-heal, plus the release-data ingest + per-release
# devlog generator steps (§ 9.2 in docs/ps1/website-plan.md).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "scripts/site-generate-library.py"
      - "scripts/site-relativize-build.py"
      - "scripts/site-build-static-root.sh"
      - "scripts/site-redteam.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel an in-flight deploy with a newer push — release deploys must
# never get killed by a docs commit. The nightly self-heal in P3 also
# depends on this.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build portable static site
        run: ../scripts/site-build-static-root.sh
        env:
          JEKYLL_ENV: production

      # Browser player disc: pull the latest release BIN/CUE into the Pages
      # artifact at deploy time, so the repository itself never carries a
      # disc image. Runs AFTER the static build so Jekyll's cleaner and the
      # red-team pass never see /game/. Mirrors the Zoomies pages workflow.
      - name: Add latest playable release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p docs/game
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern johnnycastawayps1.bin \
            --pattern johnnycastawayps1.cue \
            --dir docs/game
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" \
            --json tagName --jq .tagName)"
          bin_size="$(stat -c %s docs/game/johnnycastawayps1.bin)"
          jq -n \
            --arg tag "$tag" \
            --argjson bin_size "$bin_size" \
            '{
              bin_size: $bin_size,
              bin_url: ("../../game/johnnycastawayps1.bin?v=" + $tag),
              bios: "HLE",
              build_id: $tag,
              build_label: ($tag + " public release"),
              core: "pcsx_rearmed",
              cue_url: ("../../game/johnnycastawayps1.cue?v=" + $tag)
            }' > docs/game/metadata.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
