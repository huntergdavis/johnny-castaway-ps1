<!DOCTYPE html>
<html lang="en-US">
  <meta charset="utf-8">
  <!-- Mobile fallback: when both JS is disabled and meta-refresh
       is blocked, the user sees the H1 + manual "Click here" link
       below. Without viewport, that fallback renders at desktop
       scale on mobile. The viewport meta costs nothing on the
       happy path (which redirects in 0 seconds anyway). -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting&hellip;</title>
  <link rel="canonical" href="https://hunterdavis.com/johnny-castaway-ps1/perf/">
  <script>location="https://hunterdavis.com/johnny-castaway-ps1/perf/"</script>
  <meta http-equiv="refresh" content="0; url=https://hunterdavis.com/johnny-castaway-ps1/perf/">
  <meta name="robots" content="noindex">
  <h1>Redirecting&hellip;</h1>
  <a href="https://hunterdavis.com/johnny-castaway-ps1/perf/">Click here if you are not redirected.</a>
</html>
