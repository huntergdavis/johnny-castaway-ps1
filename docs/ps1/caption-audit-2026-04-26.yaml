notes: |
  AUDIT-WIDE OBSERVATIONS

  Count discrepancy. The task description says 62 active storyScenes
  entries; recount of story-scenes.txt (lines starting with `    {`) gave
  63. Each ADS group counts: ACTIVITY 10, BUILDING 7, FISHING 8, JOHNNY 6,
  MARY 5, MISCGAG 2, STAND 14, SUZY 2, VISITOR 6, WALKSTUF 3 = 63. The
  YAML has 63 entries (story_index 0..62).

  Existing buggy map root cause. ps1_captions.h captionSceneMap[] uses
  caption number = storyScenes index in a strictly sequential sweep:
  scene00..scene09 -> ACTIVITY 1..9, scene10..scene16 -> BUILDING, etc.
  This collides at the boundaries: scene10 (mask + yacht photos) gets
  pushed into BUILDING (sand-castle/fire) when it is actually a VISITOR
  scenario, and scene17 (lilliputians dup) lands on FISHING tag 1 even
  though it has nothing to do with fishing. Cascade error from there:
  every FISHING is off-by-one, JOHNNY/MARY day-arcs are misaligned, etc.
  This corrected map drops the sequential assumption and uses (a) ADS
  group + content match, (b) day_no / FIRST / FINAL flags for story
  arcs, and (c) SPOT/HDG hints to disambiguate STAND tags.

  Duplicate captions in corpus.
   - scene12 and scene17 describe the same event (lilliputians tie Johnny
     down). scene12 has the extra seagull-nests-on-Johnny tail, so it is
     the richer caption; scene17 is left orphan.
   - scene19 and scene25 are textually identical (catches a boot, keeps
     it); both are mapped because FISHING.ADS has 8 distinct tags and the
     original game ships 8 fishing variants (boot caught is genuinely a
     repeat scenario in the source).
   - scene51 and scene52 are textually identical (spyglass scan); mapped
     to STAND 15 and STAND 16 respectively, distinguished only by spot.
   - scene32 / scene35 / scene62 all overlap on raft work; assigned per
     ADS context (MARY 1 / BUILDING 5 / BUILDING 7 respectively).

  Captions authored against a different scene than they're now numbered.
  None outright suspected, but several STAND captions read like they
  could belong to different STAND tags than I assigned (e.g. scene47's
  'palm tree' could fit any SE-facing tag). Without runtime evidence the
  STAND mapping is a coherent guess, not a proof.

  Slots that should probably be NO_MATCH in the final source.
   - VISITOR 5 (LEFT_ISLAND, FINAL): no caption in the corpus describes
     'visitor takes Johnny off the island'. The existing buggy map points
     at scene59 here for the same reason — there simply isn't a fitting
     caption. Consider leaving caption_id empty.
   - WALKSTUF 1, 2, 3: pure walk-around transitions; only scene62
     (already at BUILDING 7) and scene63 are construction/flavor lines
     that mention walking. scene58 / scene59 placeholders here are weak.
   - BUILDING 6: weakest BUILDING slot; scene13 (sleep + Zs + walks to
     edge) is filler; consider NO_MATCH.

  Confidence summary.
   - HIGH: FISHING (all 8), JOHNNY (all 6), MARY (4 of 5), MISCGAG (both),
     SUZY (both), BUILDING 1..5, VISITOR 3 + 4 + 6 = 27 HIGH.
   - MED:  most ACTIVITY entries, some STAND entries with spot anchors,
     VISITOR 1 + 7, WALKSTUF 1.
   - LOW:  STAND idle variants without strong spot signals, BUILDING 6,
     WALKSTUF 2 + 3, VISITOR 5.
   - NO_MATCH: zero in the YAML — all 63 slots got an assignment, but
     several (flagged in their rationale) are 'least bad' picks and are
     candidates for blanking out in the eventual source change.
