<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=./www/">
  <title>Johnny Castaway PS1</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6edd8;
      --fg: #172235;
      --accent: #b3262e;
      --panel: #fff8e9;
      --line: #684a2f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #07151f;
        --fg: #f4ead4;
        --accent: #ffcc57;
        --panel: #102638;
        --line: #4fb6c6;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font: 18px/1.5 Georgia, serif;
    }
    main {
      width: min(42rem, calc(100% - 2rem));
      border: 3px solid var(--line);
      background: var(--panel);
      padding: 2rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font: 700 2rem/1.1 Georgia, serif;
    }
    a {
      color: var(--accent);
      font-weight: 700;
    }
  </style>
  <script>
    window.location.replace(new URL("./www/", window.location.href));
  </script>
</head>
<body>
  <main>
    <h1>Johnny Castaway PS1</h1>
    <p>The project website lives in the generated static build at <a href="./www/">./www/</a>.</p>
    <p>This root page exists for GitHub Pages branch-root publishing.</p>
  </main>
</body>
</html>
