title: Johnny Castaway PS1
tagline: A ground-up PlayStation 1 port of Sierra's Johnny Castaway — one scene at a time.
description: >-
  A fan port of Sierra's 1992 Johnny Castaway screensaver to the original
  PlayStation. Built with PSn00bSDK. Runs on DuckStation. Open source under
  GPL-3.0.
author: Hunter Davis

# Public URL — apex CNAME lives in the user-pages repo, this is a project page.
url: "https://hunterdavis.com"
baseurl: "/johnny-castaway-ps1"

# Stable canonical prefix that does NOT get overridden at build time.
# The build runs `jekyll build --baseurl ""` so assets and links can be
# relativized into a path-portable bundle, which blanks `site.baseurl`
# inside templates. Pages whose links must point at the deployed origin
# (404.html being the obvious one — it's served at arbitrary URL depths
# and can't rely on relative paths) use `site.canonical_baseurl` instead.
canonical_baseurl: "/johnny-castaway-ps1"

# Pinned values for P1. Phase P3 will replace these via _data/release.yml
# written by the GitHub Actions workflow at build time.
release:
  version: "0.8.1"
  tag: "v0.8.1-ps1"
  scenes_validated: 63
  scenes_total: 63
  # Headless-perf battle-card snapshot at the current release tag.
  # Used by the home-page status strip. Update on each milestone
  # release; the matrix row that backs this lives at
  # docs/ps1/research/perf-matrix-latest/. Stored as a string so a
  # trailing zero (e.g. "99.50") doesn't get coerced.
  perf_target_speed_pct: "99.4"

repo: "huntergdavis/johnny-castaway-ps1"
github_url: "https://github.com/huntergdavis/johnny-castaway-ps1"

permalink: /devlog/:slug/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from

# Default front matter applied across the site.
defaults:
  - scope: { path: "" }
    values:
      layout: page
  - scope: { path: "", type: "posts" }
    values:
      layout: post

# Jekyll's source is the site/ directory itself when run from there.
# Exclusions cover anything that shouldn't ship to _site.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - LICENSE

# Build settings
sass:
  style: compressed

# Site builds into ../docs/ so GitHub Pages can deploy from main:/docs.
# keep_files prevents Jekyll's destination-cleanup from wiping the project
# research that lives at docs/ps1/, docs/archive/, docs/general/, etc.
# Anything Jekyll itself outputs is not in this list and gets refreshed
# every build.
destination: ../docs
keep_files:
  - ps1
  - archive
  - general
  - readme
  - CLEANUP_SUMMARY.md
  - PS1_DEBUGGING.md
  - PS1_LEFT_DEBUG_PANEL.md
  - PS1_ROOT_CAUSE_EXEC_PLAN.md
  - README.md
  - resuming-1-10-2026.md
  - screenshot_decode_2026-03-10.csv

timezone: America/New_York
