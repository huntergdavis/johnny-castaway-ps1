<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0D1B2A" />
  <title>{% if page.title and page.url != "/" %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — fan port{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  {% seo title=false %}
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }} devlog" href="{{ '/devlog/feed.xml' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon.png' | relative_url }}" />
</head>
