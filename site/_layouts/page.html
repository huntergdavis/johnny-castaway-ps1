---
layout: default
---
<article class="page">
  {% if page.title %}
    <header class="page-header">
      {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
      <hr class="rule" />
    </header>
  {% endif %}
  <div class="page-body">
    {{ content }}
  </div>
</article>
